# Every push and pull request: all tests. Pushes to main that pass: deploy the website and
# security rules to Firebase. Cloud Functions are deployed by hand from the Actions tab
# ("Run workflow"), because they send email and cost money if something goes wrong.
#
# One-time setup: add the secret FIREBASE_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions),
# the JSON key of a Google Cloud service account allowed to deploy (see SETUP.md, "Deploying from GitHub").
# The site's public settings are in .env.live; the functions' settings in functions/.env.uni-teamtrack.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: Also deploy the Cloud Functions
        type: boolean
        default: false
      skip_tests:
        description: Deploy only, skip the tests (use only to retry a failed deploy of code that already passed)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Lint (undefined names, unused code, duplicate keys…)
        run: tools/ci/annotate.sh npm run lint
      - name: Unit tests
        run: tools/ci/annotate.sh npm test
      - name: Cloud Functions tests
        run: tools/ci/annotate.sh npm run test:functions
      - name: Security rules (real Firestore emulator)
        run: tools/ci/annotate.sh npm run test:rules
      - name: Restore-a-team tool and saving with two people / offline (Firestore emulator)
        run: tools/ci/annotate.sh npm run test:ops
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (demo build)
        run: tools/ci/annotate.sh npm run test:browser

  deploy:
    needs: test
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_tests)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Check the deploy key is in place
        run: |
          if [ -z "$SA" ]; then echo "::error::Deploy skipped: add the FIREBASE_SERVICE_ACCOUNT secret (Settings > Secrets and variables > Actions)"; exit 1; fi
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm ci
      - name: Build the live site
        run: npm run build:live
      - name: Make sure this is the real site, not the demo
        run: |
          if grep -rq "uni-teamtrack.firebaseapp.com" dist/assets/*.js; then echo "Build points at uni-teamtrack"; else echo "::error::Build has no Firebase project in it — refusing to deploy"; exit 1; fi
      - name: Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Deploy website and security rules
        env: { GOOGLE_APPLICATION_CREDENTIALS: '${{ runner.temp }}/sa.json' }
        run: |
          set -o pipefail
          npx firebase deploy --only hosting,firestore --project uni-teamtrack --non-interactive 2>&1 | tee deploy.log || {
            grep -iE "error|denied|permission|requires|not enabled|403|401" deploy.log | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Deploy Cloud Functions
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_functions
        env: { GOOGLE_APPLICATION_CREDENTIALS: '${{ runner.temp }}/sa.json' }
        run: |
          (cd functions && npm ci)
          set -o pipefail
          npx firebase deploy --only functions --project uni-teamtrack --non-interactive --force 2>&1 | tee fdeploy.log || {
            grep -iE "error|denied|permission|requires|not enabled|403|401" fdeploy.log | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
