# Every push and pull request: all tests. Pushes to main that pass: deploy the website and
# security rules to Firebase, and the Cloud Functions (unchanged ones are skipped), so the site and
# the server never drift apart. Pull requests get a private preview link.
# "Run workflow" on the Actions tab can also force a functions deploy.
#
# One-time setup: add the secret FIREBASE_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions),
# the JSON key of a Google Cloud service account allowed to deploy (see SETUP.md, "Deploying from GitHub").
# The site's public settings are in .env.live; the functions' settings in functions/.env.penteint-projects.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: Also deploy the Cloud Functions
        type: boolean
        default: false
      skip_tests:
        description: Deploy only, skip the tests (use only to retry a failed deploy of code that already passed)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-24.04   # pinned: since ubuntu-latest began moving to Ubuntu 26 (Oct 2026), installing the test browser failed
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Lint (undefined names, unused code, duplicate keys…)
        run: tools/ci/annotate.sh npm run lint
      - name: Unit tests
        run: tools/ci/annotate.sh npm test
      - name: Cloud Functions tests
        run: tools/ci/annotate.sh npm run test:functions
      - name: Security rules (real Firestore emulator)
        run: tools/ci/annotate.sh npm run test:rules
      - name: Restore-a-team tool and saving with two people / offline (Firestore emulator)
        run: tools/ci/annotate.sh npm run test:ops
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (demo build)
        run: tools/ci/annotate.sh npm run test:browser

  deploy:
    needs: test
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_tests)) }}
    runs-on: ubuntu-24.04   # pinned: since ubuntu-latest began moving to Ubuntu 26 (Oct 2026), installing the test browser failed
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Did the server code change?
        id: fn
        run: |
          BEFORE='${{ github.event.before }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then CH=${{ inputs.deploy_functions && 'yes' || 'no' }};
          else CH=yes; fi   # every push: Firebase skips functions whose code didn't change, so this is cheap and never misses one
          echo "changed=$CH" >> "$GITHUB_OUTPUT"; echo "Cloud Functions changed: $CH"
      - name: Check the deploy key is in place
        run: |
          if [ -z "$SA" ]; then echo "::error::Deploy skipped: add the FIREBASE_SERVICE_ACCOUNT secret (Settings > Secrets and variables > Actions)"; exit 1; fi
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm ci
      - name: Build the live site
        run: npm run build:live
      - name: Make sure this is the real site, not the demo
        run: |
          if grep -rq "penteint-projects.firebaseapp.com" dist/assets/*.js; then echo "Build points at penteint-projects"; else echo "::error::Build has no Firebase project in it — refusing to deploy"; exit 1; fi
      # Functions' packages are installed before the key is on disk, with install scripts off
      - name: Install the Cloud Functions packages
        if: steps.fn.outputs.changed == 'yes'
        run: cd functions && npm ci --ignore-scripts
      # The key goes in through an environment variable, never into the script's text
      - name: Firebase credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
      - name: Deploy website and security rules
        env: { GOOGLE_APPLICATION_CREDENTIALS: '${{ runner.temp }}/sa.json' }
        run: |
          set -o pipefail
          npx firebase deploy --only hosting,firestore --project penteint-projects --non-interactive 2>&1 | tee deploy.log || {
            grep -iE "error|denied|permission|requires|not enabled|403|401" deploy.log | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Deploy Cloud Functions
        if: steps.fn.outputs.changed == 'yes'
        env: { GOOGLE_APPLICATION_CREDENTIALS: '${{ runner.temp }}/sa.json' }
        run: |
          set -o pipefail
          npx firebase deploy --only functions --project penteint-projects --non-interactive --force 2>&1 | tee fdeploy.log || {
            grep -iE "error|denied|permission|requires|not enabled|403|401" fdeploy.log | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  # Pull requests: the change on a private preview link (expires after 7 days), posted on the PR,
  # so it can be tried on real data before it goes live. Uses the live database: try with care.
  preview:
    needs: test
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04   # pinned: since ubuntu-latest began moving to Ubuntu 26 (Oct 2026), installing the test browser failed
    timeout-minutes: 20
    permissions: { contents: read, pull-requests: write, checks: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the live site
        run: npm run build:live
      - name: Deploy to a preview channel
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a   # v0, pinned: it receives the deploy key
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: penteint-projects
          channelId: pr-${{ github.event.number }}
          expires: 7d
